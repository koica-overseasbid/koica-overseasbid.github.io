name: Refresh & Deploy KOICA Bid Dashboard

on:
  push:
    branches: [main]          # 소스 변경 푸시 시 즉시 재빌드·배포
  schedule:
    - cron: '0 0 * * *'      # 매일 00:00 UTC = 09:00 KST 자동 수집·배포
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Scrape KOICA & build (실패해도 계속 → 폴백 사용)
        id: scrape
        continue-on-error: true
        run: python refresh.py

      - name: Commit fresh index.html (Cloudflare Pages 서빙용)
        continue-on-error: true
        run: |
          if [ -f index_standalone.html ]; then cp index_standalone.html index.html; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          [ -f data.min.js ] && git add data.min.js
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): 자동 데이터 갱신 [skip ci]"
            git push origin HEAD:main
          fi

      - name: Prepare site
        run: |
          mkdir -p _site
          if [ -f index_standalone.html ]; then
            cp index_standalone.html _site/index.html
            echo "최신 데이터 배포"
          else
            cp index.html _site/index.html
            echo "::warning::수집 실패 — 커밋된 폴백(index.html) 배포"
          fi
          # 로고 PNG 함께 게시
          cp "KOICA_Logo Mark(BLUE).png" _site/ 2>/dev/null || echo "::warning::로고 PNG 없음"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
